# Builds the site (site/build_site.py: home page, guides, sitemap, 404) and publishes it to GitHub Pages:
# https://omrin.github.io/kulmus/   CHANGELOG.md is included because the home page's "what's new" comes from it.
name: pages

on:
  push:
    branches: [main]
    paths: ["site/**", "CHANGELOG.md", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build the site
        run: python3 site/build_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/_site
      - id: deployment
        uses: actions/deploy-pages@v4
